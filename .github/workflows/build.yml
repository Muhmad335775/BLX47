name: build

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      BLX47_KEYSTORE_PASSWORD: ${{ secrets.BLX47_KEYSTORE_PASSWORD }}
      BLX47_KEY_ALIAS: ${{ secrets.BLX47_KEY_ALIAS }}
      BLX47_KEY_PASSWORD: ${{ secrets.BLX47_KEY_PASSWORD }}
      BLX47_CLOUD_PROJECT_NUMBER: ${{ secrets.BLX47_CLOUD_PROJECT_NUMBER }}
      BLX47_KEYSTORE_PATH: ${{ github.workspace }}/android/app/blx47-release.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Decode release keystore
        run: |
          echo "${{ secrets.BLX47_KEYSTORE_BASE64 }}" | base64 -d > "$BLX47_KEYSTORE_PATH"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify build output
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            echo "BUILD PASS: $APK"
          else
            echo "BUILD FAIL: app-release.apk was not produced"
            exit 1
          fi

      - name: Upload app-release.apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$BLX47_KEYSTORE_PATH"
