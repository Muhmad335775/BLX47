name: generate-keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore blx47-release.keystore \
            -alias blx47key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Blx47Pass123!" \
            -keypass "Blx47Pass123!" \
            -dname "CN=BLX47, OU=BLX47, O=BLX47, L=City, ST=State, C=US"

      - name: Print base64 (copy this)
        run: |
          echo "===== COPY EVERYTHING BELOW THIS LINE ====="
          base64 -w 0 blx47-release.keystore
          echo ""
          echo "===== COPY EVERYTHING ABOVE THIS LINE ====="
