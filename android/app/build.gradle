plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.pulsex.blx47"
    compileSdk 34
    ndkVersion "26.3.11579264"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.pulsex.blx47"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        buildConfigField "long", "BLX47_CLOUD_PROJECT_NUMBER", "${System.getenv('BLX47_CLOUD_PROJECT_NUMBER') ?: '0'}L"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17", "-fvisibility=hidden"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("BLX47_KEYSTORE_PATH") ?: "blx47-release.keystore")
            storePassword System.getenv("BLX47_KEYSTORE_PASSWORD")
            keyAlias System.getenv("BLX47_KEY_ALIAS")
            keyPassword System.getenv("BLX47_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            ndk {
                debugSymbolLevel "NONE"
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols -= ["**/*.so"]
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.google.android.play:integrity:1.4.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
}
